
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Themed Article</title>

  
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #0c1328;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      line-height: 1.7;
    }

    .promo-box {
      background-color: #0c1328;
      color: #ffffff;
      padding: 24px;
      border: 1px solid #26334d;
      border-radius: 12px;
      max-width: 700px;
      margin: 30px auto;
    }

    h1 {
      color: #ffffff;
      font-size: 32px;
    }

    p {
      color: #d1d5db;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <article class="promo-box">
    <h1>Welcome to My Article</h1>
    <p>
      This is a themed article with a dark background,
      crisp text, and clean typography.
    </p>
  </article>
</body>
</html>
