<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="/submit-student" method="POST">
  <div>
    <label for="full name">Full Name:</label>
    <input type="text" id="vaishnavi" name="vaishnavi" placeholder="e.g. Enter your full name" required minlength="3">
  </div>
  <div>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div>
    <label for="track">Specialization Track:</label>
    <select id="track" name="track">
      <option value="web">Web Development</option>
      <option value="programming">Software / Programming</option>
      <option value="data">Data / AI</option>
    </select>
  </div>
  <button type="submit">Submit Registration</button>
</form>
    
</body>
</html>
